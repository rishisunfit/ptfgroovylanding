<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Background plate</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1920" height="1080"></canvas>
    <script>
      const VARIANTS = {
        warm: {
          base: [0.1, 0.0, 0.0],
          warm: [0.9, 0.1, 0.1],
          mid: [0.6, 0.5, 0.1],
          cool: [0.1, 0.35, 0.45],
          cursor: [0.18, 0.06, 0.02],
          rgScale: [0.825, 0.825, 1.0],
          brightness: 2.5,
        },
        mono: {
          base: [0.02, 0.02, 0.03],
          warm: [0.38, 0.38, 0.42],
          mid: [0.18, 0.18, 0.22],
          cool: [0.55, 0.55, 0.6],
          cursor: [0.06, 0.06, 0.08],
          rgScale: [1, 1, 1],
          brightness: 1.5,
        },
        twilight: {
          base: [0.02, 0.02, 0.1],
          warm: [0.1, 0.85, 0.8],
          mid: [0.85, 0.2, 0.65],
          cool: [0.35, 0.2, 0.75],
          cursor: [0.16, 0.04, 0.14],
          rgScale: [1, 1, 1],
          brightness: 1.9,
        },
        coffee: {
          base: [0.025, 0.015, 0.005],
          warm: [0.15, 0.085, 0.04],
          mid: [0.22, 0.13, 0.06],
          cool: [0.27, 0.18, 0.1],
          cursor: [0.08, 0.04, 0.015],
          rgScale: [1, 1, 1],
          brightness: 2.5,
        },
        royal: {
          base: [0.005, 0.012, 0.03],
          warm: [0.064, 0.152, 0.352],
          mid: [0.04, 0.22, 0.248],
          cool: [0.024, 0.14, 0.116],
          cursor: [0.008, 0.028, 0.045],
          rgScale: [1, 1, 1],
          brightness: 2.5,
        },
      };

      const VERT = `
        attribute vec2 position;
        varying vec2 v;
        void main(){
          v = position;
          gl_Position = vec4(position, 0.0, 1.0);
        }
      `;

      const FRAG = `
        precision mediump float;
        varying vec2 v;
        uniform float t;
        uniform vec2 r;
        uniform vec2 c;
        uniform float ci;
        uniform vec3 u_pal_base;
        uniform vec3 u_pal_warm;
        uniform vec3 u_pal_mid;
        uniform vec3 u_pal_cool;
        uniform vec3 u_pal_cursor;
        uniform vec3 u_pal_rgScale;
        uniform float u_brightness;

        float h(vec2 p){
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }
        float n(vec2 u){
          vec2 i = floor(u);
          vec2 f = fract(u);
          f = f*f*(3.0 - 2.0*f);
          float a = h(i);
          float b = h(i + vec2(1.0, 0.0));
          float c = h(i + vec2(0.0, 1.0));
          float d = h(i + vec2(1.0, 1.0));
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }
        float m(vec2 u){
          return (n(u)*0.5 + n(u*2.0)*0.25) * 1.06667;
        }
        void main(){
          vec2 uv = (v * 0.5 + 0.5) * r / r.x;
          vec2 cn = c / r.x;
          vec2 toC = uv - cn;
          float dC = length(toC);
          float fall = exp(-dC * 9.0) * ci;
          vec2 sh = vec2(
            n(uv * 6.0 + vec2(t * 0.9,  0.0)),
            n(uv * 6.0 + vec2(0.0, t * 1.1))
          ) - 0.5;
          vec2 disp = sh * fall * 0.55;
          uv = uv * 5.0 + disp * 5.0;
          vec2 d1 = vec2( 0.18,  0.07) * t;
          vec2 d2 = vec2(-0.13,  0.21) * t;
          vec2 d3 = vec2( 0.09, -0.16) * t;
          float a = m(uv + d1);
          vec3 col = mix(u_pal_base, u_pal_warm, a * 2.5);
          float b = m(uv + a * 2.4 + d2);
          col = mix(col, u_pal_mid, b * 1.5);
          float dd = m(uv + b * 3.5 + d3);
          col = mix(col, u_pal_cool, dd);
          col += u_pal_cursor * fall;
          col *= u_pal_rgScale;
          gl_FragColor = vec4(col * u_brightness, 1.0);
        }
      `;

      const canvas = document.getElementById("c");
      const gl = canvas.getContext("webgl", {
        alpha: false,
        antialias: false,
        depth: false,
        stencil: false,
        premultipliedAlpha: false,
        preserveDrawingBuffer: true,
      });

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
        }
        return shader;
      }

      const program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program) || "shader link failed");
      }
      gl.useProgram(program);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 3, -1, -1, 3]),
        gl.STATIC_DRAW,
      );
      const position = gl.getAttribLocation(program, "position");
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

      const loc = {
        t: gl.getUniformLocation(program, "t"),
        r: gl.getUniformLocation(program, "r"),
        c: gl.getUniformLocation(program, "c"),
        ci: gl.getUniformLocation(program, "ci"),
        base: gl.getUniformLocation(program, "u_pal_base"),
        warm: gl.getUniformLocation(program, "u_pal_warm"),
        mid: gl.getUniformLocation(program, "u_pal_mid"),
        cool: gl.getUniformLocation(program, "u_pal_cool"),
        cursor: gl.getUniformLocation(program, "u_pal_cursor"),
        rgScale: gl.getUniformLocation(program, "u_pal_rgScale"),
        brightness: gl.getUniformLocation(program, "u_brightness"),
      };

      function setVariant(id) {
        const pal = VARIANTS[id];
        if (!pal) throw new Error("unknown variant " + id);
        gl.useProgram(program);
        gl.uniform3fv(loc.base, pal.base);
        gl.uniform3fv(loc.warm, pal.warm);
        gl.uniform3fv(loc.mid, pal.mid);
        gl.uniform3fv(loc.cool, pal.cool);
        gl.uniform3fv(loc.cursor, pal.cursor);
        gl.uniform3fv(loc.rgScale, pal.rgScale);
        gl.uniform1f(loc.brightness, pal.brightness);
      }

      function draw(time) {
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform1f(loc.t, time);
        gl.uniform2f(loc.r, canvas.width, canvas.height);
        gl.uniform2f(loc.c, 0, 0);
        gl.uniform1f(loc.ci, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      window.setVariant = setVariant;
      window.draw = draw;
      window.shaderStatus = gl ? "ok" : "no webgl";
      setVariant("warm");
      draw(0);
    </script>
  </body>
</html>
